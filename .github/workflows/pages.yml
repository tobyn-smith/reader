# publishes two things to github pages from one job:
#
#   /       the browser app, which does all its work on the visitor's machine
#   /demo   a rendered example built from data/public.json
#
# the database and the reading pdfs never reach ci, so this job cannot leak
# them. it can only publish what a reviewed `vault export --public` already put
# in the repository, and the app itself carries no data at all.

name: pages

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "data/public.json"
      - "scripts/build_app.py"
      - "src/**"
      - ".github/workflows/pages.yml"
  schedule:
    - cron: "0 10 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: install
        run: |
          sudo apt-get update -q
          sudo apt-get install -qy libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
          pip install -q -e . weasyprint

      # piping curl straight into tar hides a failed download: curl exits
      # quietly, tar gets half a file and the whole deploy dies on "unexpected
      # end of file". this fetches to disk, retries, and fails on an http error
      # rather than on the corrupt tarball two steps later.
      - name: install pagefind
        run: |
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 3 \
            -o pagefind.tar.gz \
            https://github.com/CloudCannon/pagefind/releases/download/v1.3.0/pagefind-v1.3.0-x86_64-unknown-linux-musl.tar.gz
          tar xzf pagefind.tar.gz
          sudo mv pagefind /usr/local/bin/
          rm pagefind.tar.gz

      # the app goes at the root, so a visitor lands straight on the tool
      - name: build browser app
        run: python scripts/build_app.py --vendor --site _site

      - name: build demo site and pdfs
        run: |
          test -f data/public.json || { echo "no data/public.json, nothing to publish"; exit 1; }
          vault build --public --pdf
          mkdir -p _site/demo
          cp -r _site_public/* _site/demo/

      - name: check nothing private slipped in
        run: python scripts/check_publish.py _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
