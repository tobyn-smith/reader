<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not here</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%230D0D0B'/><rect x='5' y='6' width='22' height='3' fill='%23EDE8DA'/><rect x='5' y='13' width='22' height='1.5' fill='%23A39D8E'/><rect x='5' y='18' width='22' height='1.5' fill='%23A39D8E'/><rect x='5' y='23' width='14' height='1.5' fill='%23D2704A'/></svg>">
<!-- self contained on purpose: a 404 can be served from any path, so it
     loads nothing else, asks for nothing, and matches the theme from the
     system fallback faces alone -->
<style>
  :root {
    --paper: #0D0D0B;
    --ink:   #EDE8DA;
    --mid:   #A39D8E;
    --rule:  #EDE8DA;
  }

  @media (prefers-color-scheme: light) {
    :root {
      --paper: #FFFDF8;
      --ink:   #000000;
      --mid:   #4A4640;
      --rule:  #000000;
    }
  }

  html {
    background: var(--paper);
    color: var(--ink);
    font-family: "Source Serif 4", Charter, "Iowan Old Style", Georgia, serif;
    font-size: 17px;
    line-height: 1.5;
  }

  body {
    margin: 0;
    padding: 18vh 24px 0;
    border-top: 6px solid var(--rule);
    min-height: 60vh;
  }

  .mark {
    font-family: "Archivo Narrow", "Arial Narrow", sans-serif-condensed, sans-serif;
    font-weight: 700;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.22em;
    border-bottom: 3px solid var(--rule);
    padding-bottom: 8px;
    margin: 0 0 14px;
    max-width: 26rem;
  }

  p { margin: 0 0 6px; max-width: 44ch; }

  .sub {
    font-size: 13px;
    color: var(--mid);
  }

  .code {
    font-family: "IBM Plex Mono", ui-monospace, Consolas, monospace;
    font-size: 12px;
    color: var(--mid);
  }

  a { color: var(--ink); }
</style>
</head>
<body>

<p class="mark">Tobyn's Schedule Reader</p>
<p>This page doesn't exist. I checked twice. :)</p>
<p class="sub"><a id="home" href="/">Back to the reader</a></p>
<p class="code">404</p>

<script>
  // the app lives at /<repo>/ on github pages, and a fork changes the repo
  // name, so the way home is read off the address rather than hardcoded. a
  // first segment with a dot in it is a stray filename, not the repo, and
  // falls back to the root.
  var seg = location.pathname.split('/')[1]
  var home = seg && seg.indexOf('.') === -1 ? '/' + seg + '/' : '/'
  document.getElementById('home').href = home
</script>

</body>
</html>
